name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint and validate
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Install linters
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq shellcheck yamllint ansible-core

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.17.2
          terraform_wrapper: false

      - name: make lint
        run: make lint

  smoke:
    name: Build with Terraform, backup, restore
    runs-on: ubuntu-24.04
    needs: lint
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.17.2
          terraform_wrapper: false

      - name: make build
        run: make build

      - name: Push, backup, delete, restore
        run: FORCE=1 ./scripts/smoke-test.sh

      - name: down / up keeps data
        run: |
          make down
          make up
          make health

      - name: Terraform container sees the same state (no drift)
        run: TF_MODE=docker ./scripts/tf.sh plan -detailed-exitcode -input=false

      - name: Logs on failure
        if: failure()
        run: |
          docker logs gitea-lab-gitea --tail 200 || true
          docker logs gitea-lab-db --tail 100 || true

      - name: Tear down
        if: always()
        run: ./scripts/tf.sh destroy -auto-approve -input=false || true

  postgres-upgrade:
    name: PostgreSQL 17 -> 19 upgrade rehearsal
    runs-on: ubuntu-24.04
    needs: lint
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.17.2
          terraform_wrapper: false

      - name: Build on PostgreSQL 17 with a test repository
        run: |
          make bootstrap
          sed -i 's/^POSTGRES_VERSION=.*/POSTGRES_VERSION=17-alpine/' .env
          make up
          make admin
          set -a; . ./.env; set +a
          curl -fsS -u "$GITEA_ADMIN_USER:$GITEA_ADMIN_PASSWORD" -H 'Content-Type: application/json' \
            -d '{"name":"must-survive","auto_init":true}' http://127.0.0.1:3000/api/v1/user/repos > /dev/null

      - name: make up refuses a new major on old data
        run: |
          sed -i 's/^POSTGRES_VERSION=.*/POSTGRES_VERSION=19-alpine/' .env
          if make up; then echo "make up should have refused"; exit 1; fi

      - name: make upgrade-postgres
        run: FORCE=1 make upgrade-postgres

      - name: Data survived on PostgreSQL 19
        run: |
          set -a; . ./.env; set +a
          docker exec gitea-lab-db psql -U gitea -d gitea -tAc 'show server_version' | grep -q '^19'
          curl -fsS -u "$GITEA_ADMIN_USER:$GITEA_ADMIN_PASSWORD" \
            "http://127.0.0.1:3000/api/v1/repos/$GITEA_ADMIN_USER/must-survive" > /dev/null
          make health

      - name: Logs on failure
        if: failure()
        run: |
          docker logs gitea-lab-gitea --tail 100 || true
          docker logs gitea-lab-db --tail 100 || true

      - name: Tear down
        if: always()
        run: ./scripts/tf.sh destroy -auto-approve -input=false || true

  ansible:
    name: Ansible deploy (real sudo, Terraform container)
    runs-on: ubuntu-24.04
    needs: lint
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7

      - name: Install Ansible
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ansible-core

      # No setup-terraform here on purpose: the role must fall back to the
      # hashicorp/terraform container on a host without Terraform.
      - name: Bootstrap .env and secrets on the controller
        run: make bootstrap

      - name: Deploy to this runner
        run: make ansible-deploy

      - name: Second run changes nothing
        run: |
          make ansible-deploy | tee second-run.log
          grep -qE 'changed=0 +unreachable=0 +failed=0' second-run.log

      - name: Deployed lab is healthy
        run: cd /opt/gitea-lab && make health

      - name: Logs on failure
        if: failure()
        run: docker logs gitea-lab-gitea --tail 200 || true

      - name: Tear down
        if: always()
        run: cd /opt/gitea-lab && ./scripts/tf.sh destroy -auto-approve -input=false || true
