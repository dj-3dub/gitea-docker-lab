name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint and validate
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install linters
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq shellcheck yamllint ansible-core

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.17.2
          terraform_wrapper: false

      - name: make lint
        run: make lint

  smoke:
    name: Build with Terraform, backup, restore
    runs-on: ubuntu-24.04
    needs: lint
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.17.2
          terraform_wrapper: false

      - name: make build
        run: make build

      - name: Push, backup, delete, restore
        run: FORCE=1 ./scripts/smoke-test.sh

      - name: down / up keeps data
        run: |
          make down
          make up
          make health

      - name: Terraform container sees the same state (no drift)
        run: TF_MODE=docker ./scripts/tf.sh plan -detailed-exitcode -input=false

      - name: Logs on failure
        if: failure()
        run: |
          docker logs gitea-lab-gitea --tail 200 || true
          docker logs gitea-lab-db --tail 100 || true

      - name: Tear down
        if: always()
        run: ./scripts/tf.sh destroy -auto-approve -input=false || true
