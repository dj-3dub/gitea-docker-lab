name: Check image updates

on:
  schedule:
    - cron: "17 6 * * 1"   # Mondays 06:17 UTC
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Compare pinned versions with latest releases
        id: check
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          ./scripts/check-updates.sh --strict > /dev/null
          rc=$?
          set -e
          ./scripts/check-updates.sh --markdown > table.md
          cat table.md >> "$GITHUB_STEP_SUMMARY"
          if [ "$rc" -eq 10 ]; then echo "outdated=true" >> "$GITHUB_OUTPUT"; fi

      - name: Open or update the tracking issue
        if: steps.check.outputs.outdated == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          title="Image version updates available"
          {
            echo "The weekly check found newer versions than the ones pinned in \`.env.example\`."
            echo
            cat table.md
            echo
            echo "To upgrade: change the version in \`.env.example\` and \`.env\`, run \`make plan\`,"
            echo "then \`make update\` (takes a backup first)."
            echo "See [docs/operations.md](../blob/main/docs/operations.md) before a PostgreSQL major upgrade."
            echo
            echo "_Updated $(date -u +%Y-%m-%d) by the check-updates workflow._"
          } > body.md
          number=$(gh issue list --state open --search "in:title \"$title\"" --json number -q '.[0].number')
          if [ -n "$number" ]; then
            gh issue edit "$number" --body-file body.md
          else
            gh issue create --title "$title" --body-file body.md
          fi
