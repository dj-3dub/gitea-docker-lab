version: 2
updates:
  # Actions used by the CI workflows.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci

  # The kreuzwerker/docker Terraform provider (lock file in terraform/).
  - package-ecosystem: terraform
    directory: /terraform
    schedule:
      interval: weekly
    commit-message:
      prefix: terraform

# Container image versions live in .env.example, which Dependabot cannot
# read; .github/workflows/check-updates.yml covers those.
